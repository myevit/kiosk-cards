name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: git diff --exit-code dist/kiosk-cards.js
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: python3 scripts/check_public.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-browser-evidence
          path: test-results/
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: plugin
  integration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: myevit/hass-localtuya
          ref: f81c333a0a0e3b1d035651d96747a204dbfef70d
          path: .contract-integration
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile && pnpm run build && pnpm exec playwright install --with-deps chromium
      - run: pip install -r requirements_feeder_test.txt
        working-directory: .contract-integration
      - run: git rev-parse HEAD && git -C .contract-integration rev-parse HEAD
      - run: python -m pytest --import-mode=importlib -q ${{ github.workspace }}/tests/feeder/ha_contract.py --disable-socket --allow-unix-socket -o asyncio_default_fixture_loop_scope=function
        working-directory: .contract-integration
        env:
          PYTHONPATH: ${{ github.workspace }}/.contract-integration
          NATIVE_BACKEND_DIR: ${{ github.workspace }}/.contract-integration
          TUYA_FEEDER_CARD_DIR: ${{ github.workspace }}
